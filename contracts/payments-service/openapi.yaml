openapi: 3.0.0
info:
  title: Payments Service
  version: 1.0.0
paths:
  /v1/charges:
    post:
      summary: Create a charge
      operationId: createCharge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - orderId
                - amount
              properties:
                orderId:
                  type: string
                amount:
                  type: number
      responses:
        '201':
          description: Charge created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  orderId:
                    type: string
                  status:
                    type: string
